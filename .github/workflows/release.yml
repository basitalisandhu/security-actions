# Release: on a vX.Y.Z tag, run the suites, create (or update) the GitHub release from CHANGELOG.md
# and move the major tag (v0 for 0.x.y, v1 for 1.x.y) to the released commit so `uses: ...@v0` picks it up.
# Safe to re-run: an existing release gets its notes updated, and the major tag is always moved.
# Run it by hand for an existing tag with: gh workflow run release.yml -f tag=v0.1.0

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)process, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml

      - name: Validate and test
        run: |
          python3 scripts/check_actions.py
          python3 -m pytest -q
          node --test indexnow-ping/tests/*.test.mjs
          node --test sbom-diff-comment/tests/*.test.mjs

  release:
    name: Create release and move the major tag
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PY' > release-notes.md
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"Release {tag}")
          PY
          cat release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Move the major version tag
        if: ${{ !cancelled() }}
        run: |
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$MAJOR" -m "Move $MAJOR to $TAG" "$TAG^{commit}"
          git push -f origin "refs/tags/$MAJOR"
