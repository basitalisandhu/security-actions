# Release: on a v1.x.y tag, run the suites, create the GitHub release from CHANGELOG.md
# and move the major tag (v1) to the released commit so `uses: ...@v1` picks it up.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    name: Test before releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml

      - name: Validate and test
        run: |
          python3 scripts/check_actions.py
          python3 -m pytest -q
          node --test indexnow-ping/tests/*.test.mjs
          node --test sbom-diff-comment/tests/*.test.mjs

  release:
    name: Create release and move the major tag
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PY' > release-notes.md
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\].*?$(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else f"Release {tag}")
          PY
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

      - name: Move the major version tag
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$MAJOR" -m "Move $MAJOR to $GITHUB_REF_NAME"
          git push -f origin "refs/tags/$MAJOR"
